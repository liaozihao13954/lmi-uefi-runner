name: build focaltech touch driver (ARM64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Show WDK / SDK
        shell: pwsh
        run: |
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170' -ErrorAction SilentlyContinue | Select-Object -First 3 Name

      - name: Checkout FocalTechTouch
        uses: actions/checkout@v4
        with:
          repository: WOA-Project/FocalTechTouch
          ref: master
          path: src

      - name: Install WDK
        shell: pwsh
        run: |
          choco install windowsdriverkit11 -y --no-progress
          Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.22000.0\km\wdm.h'

      - name: Locate WDF headers
        shell: pwsh
        run: |
          # Use the SAME KMDF version for headers as the link libs (1.31).
          # Mixing 1.11 headers with 1.31 WdfLdr.lib gives unresolved WdfFunctions.
          $h = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include\wdf\kmdf\1.31' -Filter wdf.h -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $h) { $h = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include\wdf' -Recurse -Filter wdf.h | Sort-Object FullName -Descending | Select-Object -First 1 }
          Write-Host "WDF header: $($h.FullName)"
          $root = (Get-Location).Path
          $stub = Join-Path $root 'src\include\lmi_trace_stub.h'
          Add-Content -Path $env:GITHUB_ENV -Value ('CL=/D_ARM64_ /I"{0}" /FI"{1}"' -f $h.DirectoryName, $stub)

      - name: Replace WPP tracing with a forced-include stub
        shell: pwsh
        run: |
          #
          # WPP compiles *.tmh per source file (generated from trace.h).  Simply
          # appending a Trace macro to trace.h does nothing because no .c
          # includes it directly.  Inject one stub into EVERY translation unit
          # with /FI instead, defining all LEVEL/FLAG constants the sources use.
          #
          $stub = @'
          #pragma once
          #define TRACE_LEVEL_CRITICAL     1
          #define TRACE_LEVEL_ERROR        2
          #define TRACE_LEVEL_WARNING      3
          #define TRACE_LEVEL_INFORMATION  4
          #define TRACE_LEVEL_VERBOSE      5
          #define TRACE_INIT        1
          #define TRACE_REGISTRY    1
          #define TRACE_HID         1
          #define TRACE_PNP         1
          #define TRACE_POWER       1
          #define TRACE_SPB         1
          #define TRACE_CONFIG      1
          #define TRACE_REPORTING   1
          #define TRACE_INTERRUPT   1
          #define TRACE_SAMPLES     1
          #define TRACE_OTHER       1
          #define TRACE_IDLE        1
          #define TRACE_DRIVER      1
          // /FI injects this before any #include, so DbgPrintEx is not declared
          // yet.  Keep the stub dependency-free: a no-op macro.  Params are
          // never evaluated, so format strings / levels need not resolve.
          #define Trace(...) ((void)0)
          // WPP lifecycle macros are called directly by driver.c; stub them too.
          #define WPP_INIT_TRACING(a, b) ((void)0)
          #define WPP_CLEANUP(a) ((void)0)
          '@
          Set-Content -Path 'src\include\lmi_trace_stub.h' -Value $stub -Encoding ASCII

          # Strip the WPP-generated .tmh #includes (they would be empty now).
          Get-ChildItem 'src' -Recurse -Include *.c,*.h | ForEach-Object {
            $keep = Get-Content $_.FullName | Where-Object { $_ -notmatch '#include\s*[<"]\w+\.tmh[>"]' }
            Set-Content -Path $_.FullName -Value $keep -Encoding ASCII
          }

          # Turn off WPP generation and warning-as-error in the project file.
          $proj = 'src\contrib\FocalTechTouch.vcxproj'
          $t = Get-Content $proj -Raw
          $t = $t.Replace('<WppEnabled>true</WppEnabled>', '<WppEnabled>false</WppEnabled>')
          $t = $t.Replace('<WppRecorderEnabled>true</WppRecorderEnabled>', '<WppRecorderEnabled>false</WppRecorderEnabled>')
          $t = $t.Replace('<TreatWarningAsError>true</TreatWarningAsError>', '<TreatWarningAsError>false</TreatWarningAsError>')
          # THE root cause of "compiles but no .sys": this project declares
          # ConfigurationType=Driver but is missing <DriverType>KMDF</DriverType>,
          # so MSBuild runs ClCompile but skips the driver Link target.  Official
          # WDK KMDF projects always carry DriverType=KMDF.
          $t = $t.Replace('<ConfigurationType>Driver</ConfigurationType>',
                          '<ConfigurationType>Driver</ConfigurationType><DriverType>KMDF</DriverType>')
          Set-Content -Path $proj -Value $t -Encoding UTF8

          #
          # LMI: drop the two system-wide PoRegisterPowerSettingCallback
          # registrations.  They are unusual in a KMDF function driver, and the
          # 0xA0 (INTERNAL_POWER_ERROR, P1=0xBEEF) observed on lmi points at the
          # power policy manager.  Replace each call with STATUS_SUCCESS so the
          # driver never touches the global power-setting machinery.
          #
          Get-ChildItem 'src' -Recurse -Include *.c | ForEach-Object {
            $f = $_.FullName
            $body = Get-Content $f -Raw
            if ($body -match 'PoRegisterPowerSettingCallback|PoUnregisterPowerSettingCallback') {
              $body = $body -replace '(?s)status\s*=\s*PoRegisterPowerSettingCallback\s*\(.*?\);', 'status = STATUS_SUCCESS; /* LMI: power callback disabled */'
              $body = $body -replace '(?s)status\s*=\s*PoUnregisterPowerSettingCallback\s*\(.*?\);', 'status = STATUS_SUCCESS; /* LMI: power unregister disabled */'
              Set-Content -Path $f -Value $body -Encoding ASCII
              Write-Host "patched power callbacks in $f"
            }
          }

      # ------------------------------------------------------------------
      # LMI diagnostics: append a tiny file logger to the driver and sprinkle
      # progress markers along the device-start path.  The panel path is a
      # black box on lmi (no serial, no kernel debugger), so the only way to
      # learn where the driver stops is to have it write C:\ftlog.txt itself.
      # ------------------------------------------------------------------
      - name: LMI diagnostic logging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cfiles = Get-ChildItem 'src' -Recurse -Include *.c
          $drv = $cfiles | Where-Object { (Get-Content $_.FullName -Raw) -match 'WdfDriverCreate' } | Select-Object -First 1
          $dev = $cfiles | Where-Object { (Get-Content $_.FullName -Raw) -match 'WdfCmResourceListGetCount' } | Select-Object -First 1
          $spb = $cfiles | Where-Object { (Get-Content $_.FullName -Raw) -match 'WdfIoTargetSendWriteSynchronously' } | Select-Object -First 1
          if (-not $drv) { throw 'driver.c not found' }
          if (-not $dev) { throw 'device.c not found' }
          if (-not $spb) { throw 'spb.c not found' }
          Write-Host "drv=$($drv.FullName)"
          Write-Host "dev=$($dev.FullName)"
          Write-Host "spb=$($spb.FullName)"

          $proto = @(
            'extern void LmiLog(const char* tag);',
            'extern void LmiLogStatus(const char* tag, long st);',
            'extern void LmiLogSeq(const char* tag);'
          )
          foreach ($f in @($drv, $dev, $spb)) {
            $cur = Get-Content -LiteralPath $f.FullName
            Set-Content -LiteralPath $f.FullName -Value ($proto + $cur) -Encoding ASCII
          }

          function Insert-Line {
            param([string]$File, [string]$Anchor, [string]$Code, [switch]$After)
            $lines = @(Get-Content -LiteralPath $File)
            $hit = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i].Trim() -eq $Anchor) { $hit = $i; break }
            }
            if ($hit -lt 0) { throw "anchor not found: $Anchor" }
            $ind = [regex]::Match($lines[$hit], '^[ \t]*').Value
            if ($After) {
              if ($hit -lt ($lines.Count - 1)) {
                $n = @($lines[0..$hit]) + ($ind + $Code) + @($lines[($hit + 1)..($lines.Count - 1)])
              } else {
                $n = @($lines) + ($ind + $Code)
              }
            } else {
              if ($hit -gt 0) {
                $n = @($lines[0..($hit - 1)]) + ($ind + $Code) + @($lines[$hit..($lines.Count - 1)])
              } else {
                $n = @($ind + $Code) + @($lines)
              }
            }
            Set-Content -LiteralPath $File -Value $n -Encoding ASCII
            Write-Host ("  OK  " + $Anchor)
          }

          Insert-Line -File $drv.FullName -Anchor 'WDF_DRIVER_CONFIG_INIT(&config, OnDeviceAdd);' -Code 'LmiLog("S0:DriverEntry");'
          Insert-Line -File $drv.FullName -Anchor 'WdfDeviceInitSetPowerPolicyOwnership(DeviceInit, FALSE);' -Code 'LmiLog("S1:OnDeviceAdd");'
          Insert-Line -File $drv.FullName -Anchor 'status = WdfDeviceCreate(&DeviceInit, &attributes, &fxDevice);' -Code 'LmiLogStatus("S1:WdfDeviceCreate", status);' -After

          Insert-Line -File $dev.FullName -Anchor 'resourceCount = WdfCmResourceListGetCount(FxResourcesTranslated);' -Code 'LmiLogStatus("S2:ResCount", (long)resourceCount);' -After
          Insert-Line -File $dev.FullName -Anchor 'status = SpbTargetInitialize(FxDevice, &devContext->I2CContext);' -Code 'LmiLogStatus("S3:SpbInit", status);' -After
          Insert-Line -File $dev.FullName -Anchor 'status = PowerInitialize(FxDevice);' -Code 'LmiLogStatus("S4:PowerInit", status);' -After
          Insert-Line -File $dev.FullName -Anchor 'status = TchAllocateContext(&devContext->TouchContext, FxDevice);' -Code 'LmiLogStatus("S5:TchAlloc", status);' -After
          Insert-Line -File $dev.FullName -Anchor 'status = TchRegistryGetControllerSettings(' -Code 'LmiLog("S6:Registry");'
          Insert-Line -File $dev.FullName -Anchor 'status = ReportConfigureContinuousSimulationTimer(devContext->FxDevice);' -Code 'LmiLogStatus("S7:Timer", status);' -After
          Insert-Line -File $dev.FullName -Anchor 'status = TchStartDevice(devContext->TouchContext, &devContext->I2CContext);' -Code 'LmiLogStatus("S8:TchStart", status);' -After

          Insert-Line -File $spb.FullName -Anchor 'status = WdfIoTargetSendWriteSynchronously(' -Code 'LmiLogSeq("SPB:W");'
          Insert-Line -File $spb.FullName -Anchor 'status = WdfIoTargetSendReadSynchronously(' -Code 'LmiLogSeq("SPB:R");'

          $impl = @(
            '',
            '/* ===== LMI diagnostic log ===== */',
            'static long g_lmiSeq = 0;',
            'static int  g_lmiLogFail = 0;',
            '',
            'static HANDLE LmiLogOpen(const wchar_t* p)',
            '{',
            '    UNICODE_STRING    path;',
            '    OBJECT_ATTRIBUTES oa;',
            '    IO_STATUS_BLOCK   iosb;',
            '    HANDLE            h = NULL;',
            '',
            '    RtlInitUnicodeString(&path, p);',
            '    InitializeObjectAttributes(&oa, &path, OBJ_CASE_INSENSITIVE | OBJ_KERNEL_HANDLE, NULL, NULL);',
            '    if (NT_SUCCESS(ZwCreateFile(&h, FILE_APPEND_DATA | SYNCHRONIZE, &oa, &iosb, NULL,',
            '                                FILE_ATTRIBUTE_NORMAL, FILE_SHARE_READ | FILE_SHARE_WRITE,',
            '                                FILE_OPEN_IF, FILE_SYNCHRONOUS_IO_NONALERT, NULL, 0))) {',
            '        return h;',
            '    }',
            '    return NULL;',
            '}',
            '',
            'static void LmiLogWrite(const char* tag, long st, int mode)',
            '{',
            '    IO_STATUS_BLOCK iosb;',
            '    HANDLE          h = NULL;',
            '    char            buf[176];',
            '    int             n = 0;',
            '    int             i;',
            '    const char*     hex = "0123456789ABCDEF";',
            '',
            '    while (tag && *tag && n < 100) { buf[n++] = *tag++; }',
            '    if (mode) {',
            '        unsigned long v = (unsigned long)st;',
            '        buf[n++] = 32; buf[n++] = 61; buf[n++] = 32;',
            '        buf[n++] = 48; buf[n++] = 120;',
            '        for (i = 28; i >= 0; i -= 4) { buf[n++] = hex[(v >> i) & 0xF]; }',
            '    }',
            '    buf[n++] = 13; buf[n++] = 10;',
            '',
            '    h = LmiLogOpen(L"\\??\\C:\\ftlog.txt");',
            '    if (h == NULL) { h = LmiLogOpen(L"\\SystemRoot\\ftlog.txt"); }',
            '    if (h == NULL) { h = LmiLogOpen(L"\\??\\C:\\Windows\\Temp\\ftlog.txt"); }',
            '    if (h == NULL) {',
            '        if (g_lmiLogFail == 0) {',
            '            g_lmiLogFail = 1;',
            '            KeBugCheckEx(0xDEAD0001, 0xF10, 0, 0, 0);',
            '        }',
            '        return;',
            '    }',
            '    ZwWriteFile(h, NULL, NULL, NULL, &iosb, buf, (ULONG)n, NULL, NULL);',
            '    ZwClose(h);',
            '}',
            '',
            'void LmiLog(const char* tag) { LmiLogWrite(tag, 0, 0); }',
            'void LmiLogStatus(const char* tag, long st) { LmiLogWrite(tag, st, 1); }',
            'void LmiLogSeq(const char* tag) { g_lmiSeq++; if (g_lmiSeq <= 80) { LmiLogWrite(tag, g_lmiSeq, 1); } }'
          )
          $impl | ForEach-Object { Add-Content -LiteralPath $drv.FullName -Value $_ -Encoding ASCII }
          Write-Host "logger appended to $($drv.FullName)"
          Select-String -LiteralPath $drv.FullName -Pattern 'ftlog' | ForEach-Object { Write-Host $_.Line.Trim() }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC ARM64 tools (for link.exe)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Drop selftest sources (unused ARM64-intrinsic headaches)
        shell: pwsh
        run: |
          $proj = 'src\contrib\FocalTechTouch.vcxproj'
          $t = Get-Content $proj -Raw
          $t = $t -replace '<ClCompile Include="[^"]*selftest\.c"\s*/>', ''
          $t = $t -replace '<ClCompile Include="[^"]*enoselftest\.c"\s*/>', ''
          Set-Content -Path $proj -Value $t -Encoding UTF8

      - name: Build Release ARM64 (compile only; WDK target link is skipped on runner)
        shell: cmd
        run: |
          msbuild src\contrib\FocalTechTouch.vcxproj /t:Build /p:TreatWarningAsError=false /p:BufferSecurityCheck=false /p:Configuration=Release /p:Platform=ARM64 /p:WindowsTargetPlatformVersion=10.0.22621.0 /p:DDK_INC_PATH="C:\Program Files (x86)\Windows Kits\10\Include\10.0.22000.0\km" /p:SignMode=Off /p:Inf2CatEnabled=false /m /v:minimal
          echo "=== compile exit=%errorlevel% ==="
          echo "=== locate MSVC arm64 link.exe (absolute) ==="
          set "LINKEXE="
          for /d %%V in ("C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\*") do if exist "%%V\bin\HostX86\arm64\link.exe" set "LINKEXE=%%V\bin\HostX86\arm64\link.exe"
          echo LINKEXE=%LINKEXE%
          echo "=== locate WDK km arm64 lib dir ==="
          set "LIBDIR="
          for %%W in (10.0.22000.0 10.0.22621.0 10.0.26100.0) do if exist "C:\Program Files (x86)\Windows Kits\10\Lib\%%W\km\arm64\ntoskrnl.lib" set "LIBDIR=C:\Program Files (x86)\Windows Kits\10\Lib\%%W\km\arm64"
          echo LIBDIR=%LIBDIR%
          echo "=== locate WdfDriverEntry.lib ==="
          dir /s /b "C:\Program Files (x86)\Windows Kits\10\Lib\wdf\kmdf\arm64\*WdfDriverEntry.lib" 2>nul
          echo "=== build CRT-symbol fallback obj (swprintf from 1.31 headers) ==="
          set "CC="
          for /d %%V in ("C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\*") do if exist "%%V\bin\HostX86\arm64\cl.exe" set "CC=%%V\bin\HostX86\arm64\cl.exe"
          > fallback.c echo void __security_init_cookie(void) {}
          >> fallback.c echo void __security_check_cookie(unsigned long long x) { (void)x; }
          >> fallback.c echo void __security_push_cookie(void) {}
          >> fallback.c echo void __security_pop_cookie(void) {}
          >> fallback.c echo int LmiVswprintfStub(void) { return 0; }
          >> fallback.c echo long TchSelfTestInitialize(void *d) { (void)d; return 0; }
          >> fallback.c echo long TchEnoSelfTestInitialize(void *d) { (void)d; return 0; }
          "%CC%" /nologo /c /Fo:fallback.obj fallback.c
          dir fallback.obj
          echo "=== MANUAL LINK ==="
          set "WDFLIB=C:\Program Files (x86)\Windows Kits\10\Lib\wdf\kmdf\arm64\1.31"
          cd src\intermediate\ARM64
          set "RES="
          if exist "Resource.res" set "RES=Resource.res"
          "%LINKEXE%" /nologo /DRIVER /SUBSYSTEM:NATIVE /MACHINE:ARM64 /NODEFAULTLIB /INCREMENTAL:NO /ENTRY:FxDriverEntry /OUT:FocalTechTouch.sys /PDB:FocalTechTouch.pdb *.obj %RES% ..\..\..\fallback.obj /alternatename:__imp___stdio_common_vswprintf=LmiVswprintfStub /LIBPATH:"%LIBDIR%" /LIBPATH:"%WDFLIB%" WdfDriverEntry.lib WdfLdr.lib hidclass.lib ntoskrnl.lib hal.lib wdmsec.lib
          echo "=== manual link exit=%errorlevel% ==="
          dir /s /b *.sys 2>nul
          exit /b 0

      - name: Adapt INF hardware IDs for lmi
        shell: pwsh
        run: |
          $inf = 'src\src\FocalTechTouch.inf'
          if (-not (Test-Path $inf)) { $inf = (Get-ChildItem src -Recurse -Filter FocalTechTouch.inf | Select-Object -First 1).FullName }
          $bytes = [System.IO.File]::ReadAllBytes($inf)
          $enc = if ($bytes.Length -ge 2 -and $bytes[0] -eq 0xFF -and $bytes[1] -eq 0xFE) { [System.Text.Encoding]::Unicode } else { [System.Text.Encoding]::ASCII }
          $t = $enc.GetString($bytes)
          if ($t -notmatch 'PNP0C50') {
            $t = $t -replace '(\[Standard\.NT\$ARCH\$\]\r?\n)', "`$1%TchDriver_Device_Desc% = TchDriver_Device.NT, ACPI\PNP0C50`r`n%TchDriver_Device_Desc% = TchDriver_Device.NT, ACPI\FTS0001`r`n"
            [System.IO.File]::WriteAllBytes($inf, $enc.GetBytes($t))
          }
          Write-Host "INF IDs:"
          ($t -split "`r?`n" | Where-Object { $_ -match 'ACPI' }) | ForEach-Object { Write-Host "  $_" }

      - name: Collect
        shell: pwsh
        run: |
          Write-Host "=== all build outputs ==="
          foreach ($ext in @('*.sys','*.dll','*.inf','*.pdb')) {
            Get-ChildItem -Path . -Recurse -Filter $ext -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\packages\\' } |
              ForEach-Object { Write-Host "  $($_.FullName)  ($($_.Length))" }
          }
          New-Item -ItemType Directory -Force out | Out-Null
          foreach ($ext in @('*.sys','*.inf','*.pdb')) {
            Get-ChildItem -Path src -Recurse -Filter $ext -ErrorAction SilentlyContinue |
              Copy-Item -Destination out -Force
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ftdrv-arm64
          path: out\*
          if-no-files-found: error
