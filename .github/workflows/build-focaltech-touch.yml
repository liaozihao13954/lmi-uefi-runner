name: build focaltech touch driver (ARM64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Show WDK / SDK
        shell: pwsh
        run: |
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170' -ErrorAction SilentlyContinue | Select-Object -First 3 Name

      - name: Checkout FocalTechTouch
        uses: actions/checkout@v4
        with:
          repository: WOA-Project/FocalTechTouch
          ref: master
          path: src

      - name: Install WDK
        shell: pwsh
        run: |
          choco install windowsdriverkit11 -y --no-progress
          Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.22000.0\km\wdm.h'

      - name: Locate WDF headers
        shell: pwsh
        run: |
          $h = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include\wdf' -Recurse -Filter wdf.h | Select-Object -First 1
          Write-Host "WDF header: $($h.FullName)"
          $root = (Get-Location).Path
          $stub = Join-Path $root 'src\include\lmi_trace_stub.h'
          Add-Content -Path $env:GITHUB_ENV -Value ('CL=/D_ARM64_ /I"{0}" /FI"{1}"' -f $h.DirectoryName, $stub)

      - name: Replace WPP tracing with a forced-include stub
        shell: pwsh
        run: |
          #
          # WPP compiles *.tmh per source file (generated from trace.h).  Simply
          # appending a Trace macro to trace.h does nothing because no .c
          # includes it directly.  Inject one stub into EVERY translation unit
          # with /FI instead, defining all LEVEL/FLAG constants the sources use.
          #
          $stub = @'
          #pragma once
          #define TRACE_LEVEL_CRITICAL     1
          #define TRACE_LEVEL_ERROR        2
          #define TRACE_LEVEL_WARNING      3
          #define TRACE_LEVEL_INFORMATION  4
          #define TRACE_LEVEL_VERBOSE      5
          #define TRACE_INIT        1
          #define TRACE_REGISTRY    1
          #define TRACE_HID         1
          #define TRACE_PNP         1
          #define TRACE_POWER       1
          #define TRACE_SPB         1
          #define TRACE_CONFIG      1
          #define TRACE_REPORTING   1
          #define TRACE_INTERRUPT   1
          #define TRACE_SAMPLES     1
          #define TRACE_OTHER       1
          #define TRACE_IDLE        1
          #define TRACE_DRIVER      1
          // /FI injects this before any #include, so DbgPrintEx is not declared
          // yet.  Keep the stub dependency-free: a no-op macro.  Params are
          // never evaluated, so format strings / levels need not resolve.
          #define Trace(...) ((void)0)
          '@
          Set-Content -Path 'src\include\lmi_trace_stub.h' -Value $stub -Encoding ASCII

          # Strip the WPP-generated .tmh #includes (they would be empty now).
          Get-ChildItem 'src' -Recurse -Include *.c,*.h | ForEach-Object {
            $keep = Get-Content $_.FullName | Where-Object { $_ -notmatch '#include\s*[<"]\w+\.tmh[>"]' }
            Set-Content -Path $_.FullName -Value $keep -Encoding ASCII
          }

          # Turn off WPP generation and warning-as-error in the project file.
          $proj = 'src\contrib\FocalTechTouch.vcxproj'
          $t = Get-Content $proj -Raw
          $t = $t.Replace('<WppEnabled>true</WppEnabled>', '<WppEnabled>false</WppEnabled>')
          $t = $t.Replace('<WppRecorderEnabled>true</WppRecorderEnabled>', '<WppRecorderEnabled>false</WppRecorderEnabled>')
          $t = $t.Replace('<TreatWarningAsError>true</TreatWarningAsError>', '<TreatWarningAsError>false</TreatWarningAsError>')
          # THE root cause of "compiles but no .sys": this project declares
          # ConfigurationType=Driver but is missing <DriverType>KMDF</DriverType>,
          # so MSBuild runs ClCompile but skips the driver Link target.  Official
          # WDK KMDF projects always carry DriverType=KMDF.
          $t = $t.Replace('<ConfigurationType>Driver</ConfigurationType>',
                          '<ConfigurationType>Driver</ConfigurationType><DriverType>KMDF</DriverType>')
          Set-Content -Path $proj -Value $t -Encoding UTF8

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release ARM64
        shell: cmd
        run: |
          msbuild src\contrib\FocalTechTouch.vcxproj /t:Build /p:TreatWarningAsError=false /p:Configuration=Release /p:Platform=ARM64 /p:WindowsTargetPlatformVersion=10.0.22621.0 /p:DDK_INC_PATH="C:\Program Files (x86)\Windows Kits\10\Include\10.0.22000.0\km" /p:SignMode=Test /p:Inf2CatEnabled=false /m /v:normal
          echo "=== msbuild exit=%errorlevel% ==="
          echo "=== WDK targets present? ==="
          dir "C:\Program Files (x86)\Windows Kits\10\build" 2>nul
          where link.exe 2>nul
          echo "=== obj files ==="
          dir /s /b src\intermediate\*.obj 2>nul
          echo "=== find WDF libs ==="
          dir /s /b "C:\Program Files (x86)\Windows Kits\10\Lib\10.0.22000.0\km\*Wdf*.lib" 2>nul
          echo "=== find MSVC link.exe (arm64) ==="
          dir /s /b "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\*\bin\HostX86\arm64\link.exe" 2>nul
          echo "=== MANUAL LINK ==="
          set "LIBDIR=C:\Program Files (x86)\Windows Kits\10\Lib\10.0.22000.0\km\arm64"
          set "LINKEXE="
          for /f "delims=" %%L in ('dir /s /b "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\*\bin\HostX86\arm64\link.exe" 2^>nul') do set "LINKEXE=%%L"
          echo LINKEXE=%LINKEXE%
          cd src\intermediate\ARM64
          "%LINKEXE%" /nologo /DRIVER /SUBSYSTEM:WINDOWS /MACHINE:ARM64 /NODEFAULTLIB /INCREMENTAL:NO /ENTRY:FxDriverEntry /OUT:FocalTechTouch.sys /PDB:FocalTechTouch.pdb *.obj Resource.res /LIBPATH:"%LIBDIR%" /LIBPATH:"%LIBDIR%\wdf" WdfLdr.lib WdfDriverEntry.lib hidclass.lib ntoskrnl.lib hal.lib wdmsec.lib
          echo "=== manual link exit=%errorlevel% ==="
          dir /s /b *.sys 2>nul
          exit /b 0

      - name: Collect
        shell: pwsh
        run: |
          Write-Host "=== all build outputs ==="
          foreach ($ext in @('*.sys','*.dll','*.inf','*.pdb')) {
            Get-ChildItem -Path . -Recurse -Filter $ext -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\packages\\' } |
              ForEach-Object { Write-Host "  $($_.FullName)  ($($_.Length))" }
          }
          New-Item -ItemType Directory -Force out | Out-Null
          foreach ($ext in @('*.sys','*.inf','*.pdb')) {
            Get-ChildItem -Path src -Recurse -Filter $ext -ErrorAction SilentlyContinue |
              Copy-Item -Destination out -Force
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ftdrv-arm64
          path: out\*
          if-no-files-found: error
